[project]
name = "rr-organizador-de-arquivos"
version = "0.1.0"
description = "Organizador Inteligente e Automatizado de Arquivos com PySide6 e SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pyinstaller>=6.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["test_*.py"]
